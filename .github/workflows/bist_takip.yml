name: BIST_Takip

on:
  schedule:
    - cron: '16 1 * * 1-5'    # Türkiye saatiyle 10:20 (UTC 21:20)
    - cron: '16 3 * * 1-5'    # Türkiye saatiyle 11:20 (UTC 11:00)
    - cron: '16 4 * * 1-5'    # Türkiye saatiyle 14:00 (UTC 11:00)
    - cron: '16 6 * * 1-5'   # Türkiye saatiyle 17:30 (UTC 15:30)
    - cron: '0 7 * * 1-5'    # Türkiye saatiyle 16:20 (UTC 18:20)
    - cron: '40 10 * * 1-5'    # Türkiye saatiyle 16:20 (UTC 18:20)
  
  
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install yfinance requests pandas numpy
    
    - name: Run bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python bist_takip.py
