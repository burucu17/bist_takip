name: BIST_Takip

on:
  schedule:
    - cron: '20 23 * * 1-5'    # Türkiye saatiyle 00:20 (UTC 21:20)
    - cron: '20 0 * * 1-5'    # Türkiye saatiyle 10:20 (UTC 11:00)
    - cron: '20 2 * * 1-5'    # Türkiye saatiyle 14:00 (UTC 11:00)
    - cron: '40 5 * * 1-5'   # Türkiye saatiyle 18:30 (UTC 15:30)
    - cron: '20 8 * * 1-5'    # Türkiye saatiyle 1:00 (UTC 11:00)
  
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install yfinance requests pandas numpy
    
    - name: Run bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python bist_takip.py
