name: BIST_Takip

on:
  schedule:
    - cron: '0 2 * * 1-5'    # Türkiye saatiyle 10:20 (UTC 11:00)
    - cron: '0 4 * * 1-5'    # Türkiye saatiyle 11:20 (UTC 13:00)
    - cron: '0 7 * * 1-5'    # Türkiye saatiyle 14:00 (UTC 16:00)
    - cron: '0 10 * * 1-5'    # Türkiye saatiyle 16:20 (UTC 19:00)
  
  
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install yfinance requests pandas numpy
    
    - name: Run bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python bist_takip.py
